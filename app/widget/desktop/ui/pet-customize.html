<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/pet-customize.css"><script src="/pet-customize.js" defer></script><title>自定义图片</title></head><body>
<main><h1 id="title"></h1><p id="intro"></p><label class="master-switch"><input id="companion-enabled" type="checkbox"> 启用额度挂件</label><section id="client" hidden><label>背景图库<select id="client-selection"></select></label><div class="preview large"><img id="client-preview" alt="背景预览"><span id="native-preview" hidden>ChatGPT 默认背景<br>跟随客户端原生浅色 / 深色模式</span></div><div class="actions"><button id="client-choose" class="primary">选择本机图片…</button><button id="client-apply">应用所选图片</button><button id="client-reset">恢复默认背景</button></div><div id="client-controls"><hr><label>背景亮度<input id="client-brightness" type="range" min="0.4" max="1.4" step="0.01"></label><label>遮罩透明度<input id="client-mask" type="range" min="0" max="0.85" step="0.01"></label><label>模糊程度<input id="client-blur" type="range" min="0" max="15" step="0.5"></label><label><input id="client-rotation" type="checkbox"> 每分钟轮播</label><label><input id="client-enabled" type="checkbox"> 启用图片背景</label></div></section>
<section id="widget" hidden><h2>四个自定义表情槽</h2><p>默认四个槽共用当前这一张图片；可以分别替换，单击按槽位循环。推荐透明 PNG。</p><div id="slots" class="slots"></div><div class="preview portrait"><img id="widget-preview" alt="挂件图片预览"></div><div class="actions"><button id="widget-choose" class="primary">替换选中表情…</button><button id="widget-reset">恢复这个表情</button></div><hr><h2>气泡底图</h2><p>额度和彩蛋文字保持清晰，内容不增加小字。</p><div class="preview bubble"><img id="bubble-preview" alt="气泡底图预览" hidden><span id="bubble-sample">五小时　<span>—</span><br>每周　　<span>—</span><br>剩余重置　<span>—</span></span></div><div class="actions"><button id="bubble-choose">选择气泡底图…</button><button id="bubble-reset">恢复纯色气泡</button></div><label>底图可见程度<input id="bubble-opacity" aria-label="底图可见程度" type="range" min="0" max="0.65" step="0.05"></label><button id="widget-reset-all">恢复全部挂件图片</button></section>
<p id="status" role="status" aria-live="polite"></p><small>支持 PNG、JPG、WebP，单张不超过 10 MB。图片仅保存在本机，原文件不修改。</small></main></body></html>
